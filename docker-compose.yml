services:
  rockfeed:
    build: .
    image: rockfeed-rj:latest
    container_name: rockfeed-rj
    ports:
      - "8765:8765"
    volumes:
      - ./app/data:/app/data:Z
    environment:
      - REVEL_INGEST_URL=${REVEL_INGEST_URL:-}
      - REVEL_INGEST_API_KEY=${REVEL_INGEST_API_KEY:-}
    restart: unless-stopped
